name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies & Build Web
        run: |
          bun install
          bun run build

      - name: Setup Capacitor
        run: |
          bun add @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          bunx cap init "SIM OFFER SHOP" com.simoffershop.app --web-dir dist
          bunx cap add android
          bun add -D @capacitor/assets && bunx @capacitor/assets generate --android --iconSource logo.png.jpg
          bunx cap sync
          
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telecom-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
